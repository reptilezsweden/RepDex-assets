name: Sync Pokemon addressable assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fetch source subfolder
        run: |
          git remote add pokeminers https://github.com/PokeMiners/pogo_assets.git 2>/dev/null || true
          git fetch pokeminers master
          git checkout pokeminers/master -- "Images/Pokemon - 256x256/Addressable Assets"

      - name: Write the file list
        # One filename per line, read by RepDex (Admin → Unused images) without listing the folder through the GitHub API.
        run: |
          ls -1 "Images/Pokemon - 256x256/Addressable Assets" | LC_ALL=C sort > "Images/Pokemon - 256x256/files.txt"

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet --cached && git diff --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git add "Images/Pokemon - 256x256/Addressable Assets" "Images/Pokemon - 256x256/files.txt"
          git commit -m "Sync Pokemon addressable assets"
          git push origin HEAD:main
